name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android platform files
        run: flutter create --platforms=android --project-name khung_hinh_tablet .

      - name: Upgrade dependencies & Force compileSdk 36
        run: |
          flutter pub upgrade file_picker
          if [ -f android/build.gradle.kts ]; then
            cat << 'EOF' >> android/build.gradle.kts
          subprojects {
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.gradle.LibraryExtension> {
                      compileSdk = 36
                  }
              }
          }
          EOF
          else
            cat << 'EOF' >> android/build.gradle
          subprojects {
              plugins.withId("com.android.library") {
                  android {
                      compileSdkVersion 36
                  }
              }
          }
          EOF
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
